<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bowling Scoresheet</title>
    <style>
      body {
        margin: 45px 0 0 0;
        font-family: Arial, sans-serif;
        background: #000000;
        color: #ffffff;
      }

      button.menuButton {
        background: #222;
        color: #fff;
        border: 1px solid #555;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
        font-weight: bold;
      }

      button.functionButton {
        cursor: pointer;
        height: 3em;
        background: red;
        color: black;
        font-weight: bold;
        margin: 5px;
        display: none;
      }

      button.scoreButton {
        cursor: pointer;
        height: 3em;
        width: 3em;
        background: blue;
        color: white;
        font-weight: bold;
        font-size: 13px;
      }

      button.scoreButton:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background-color: #cccccc;
      }

      .team-wrapper {
        border-top: 5px dashed #666;
      }

      table.scoreTable {
        border-collapse: collapse;
        background: #fff;
        color: #000;
        font-size: 13px;
      }

      table.scoreButtonTable {
        border-collapse: collapse;
      }

      tr {
        background-color: transparent;
        transition: background-color 0.8s ease-in-out;
      }

      tr.selected {
        background-color: aqua;
      }

      th,
      td {
        border: 1px solid #333;
        background-color: transparent;
      }

      td.scoreButtonCell {
        border: none;
        padding: 5px 16px 5px 0px;
      }

      th.frame {
        background: #ddd;
      }

      td.split {
        background-color: pink;
      }

      td.roll {
        font-weight: bold;
        padding: 2px;
        min-width: 10px;
        height: 1.2em;
        text-align: center;
      }

      td.frameTotal {
        font-weight: bold;
        height: 1.2em;
        border-bottom: 3px solid #333;
        text-align: center;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }

      td.frameTotal.isvisible {
        opacity: 1;
      }

      td.playerNote {
        text-align: right;
      }

      .floating-container-top-left {
        position: fixed;
        top: 5px;
        left: 0px;
        z-index: 1000;
      }

      .input-playername {
        width: 110px;
        font-size: 14px;
        color: black;
        background-color: transparent;
        border: 0;
      }

      .input-message {
        width: 305px;
        font-size: 16px;
        color: cyan;
        background-color: #333;
        border: 0;
        text-align: center;
        position: fixed;
        bottom: 2px;
        left: 2px;
      }

      .container-keypad {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <!-- Top Global Menu Controls -->
    <div class="floating-container-top-left">
      <button class="menuButton" onclick="toggleFunctionButtons()">
        More...
      </button>
      <button class="functionButton" onclick="clearScores()">
        Clear All Scores
      </button>
      <button class="functionButton" onclick="loadHeaderViaJSONP()">
        Load Match Score
      </button>
      <button class="functionButton" onclick="addTeam()">+ Add Team</button>
      <button class="functionButton" onclick="promptRemoveTeam()">
        - Remove Team
      </button>
      <button class="functionButton" onclick="promptAddPlayer()">
        + Add Bowler
      </button>
      <button class="functionButton" onclick="promptRemovePlayer()">
        - Remove Bowler
      </button>
    </div>

    <!-- Dynamic Teams Master Container -->
    <div id="teamsContainer"></div>

    <input class="input-message" id="TopMessage" />

    <script>
      const ROLLS = 21;
      const FRAMES = 10;
      let spreadSheetId = "";
      let spreadSheetRow = 0;
      let spreadSheetCol = 0;

      let teams = [];

      function initApp() {
        const urlParams = new URLSearchParams(window.location.search);
        spreadSheetId = urlParams.get("spreadsheetid");
        spreadSheetRow = parseInt(urlParams.get("spreadsheetrow"), 10);
        spreadSheetCol = parseInt(urlParams.get("spreadsheetcol"), 10);

        const teamCountParam = parseInt(urlParams.get("teams"), 10);
        const totalTeams =
          Number.isFinite(teamCountParam) && teamCountParam > 0
            ? teamCountParam
            : 1;

        teams = [];
        for (let t = 0; t < totalTeams; t++) {
          const bowlerCountParam = parseInt(urlParams.get(`team${t}count`), 10);
          const bowlerCount =
            Number.isFinite(bowlerCountParam) && bowlerCountParam > 0
              ? bowlerCountParam
              : 1;

          const teamObj = createNewTeam(`Team ${t + 1}`);
          for (let b = 0; b < bowlerCount; b++) {
            teamObj.players.push(newPlayer());
          }
          teams.push(teamObj);
        }

        fullRebuild();
      }

      function createNewTeam(name) {
        return {
          players: [],
          selectedIndex: 0,
          tbody: null,
        };
      }

      function newPlayer() {
        return { name: "", rolls: Array(ROLLS).fill(""), splits: new Set() };
      }

      function getPlayer(teamIndex) {
        const t = teams[teamIndex];
        return t ? t.players[t.selectedIndex] || null : null;
      }

      function rollPoints(roll) {
        return isStrike(roll) ? 10 : parseInt(roll, 10);
      }

      function isStrike(roll) {
        return roll === "X";
      }

      function isSpare(roll) {
        return roll === "/";
      }

      function toggleFunctionButtons() {
        document.querySelectorAll(".functionButton").forEach((button) => {
          button.style.display =
            button.style.display === "block" ? "none" : "block";
        });
      }

      function addTeam() {
        const nextNumber = teams.length + 1;
        const team = createNewTeam(`Team ${nextNumber}`);
        team.players.push(newPlayer());
        teams.push(team);
        fullRebuild();
      }

      function promptRemoveTeam() {
        toggleFunctionButtons();
        if (teams.length <= 1) {
          alert("At least one team must remain active.");
          return;
        }
        const teamIndex = promptTeamIndex("Remove Team");
        if (teamIndex !== null) {
          removeTeam(teamIndex);
        }
      }

      function removeTeam(teamIndex) {
        if (teams.length <= 1) {
          alert("At least one team must remain active.");
          return;
        }
        const team = teams[teamIndex];
        if (!team) return;

        const bowlerNames = team.players
          .map((p, idx) => p.name.trim() || `Bowler ${idx + 1}`)
          .join(", ");

        const msg = bowlerNames
          ? `Are you sure you want to remove Team ${teamIndex} (${bowlerNames})?`
          : `Are you sure you want to remove Team ${teamIndex}?`;

        if (confirm(msg)) {
          teams.splice(teamIndex, 1);
          fullRebuild();
        }
      }

      function promptTeamIndex(actionName) {
        if (teams.length === 0) return null;
        if (teams.length === 1) return 0;

        const options = teams.map((_, i) => `${i}`).join(", ");
        const response = prompt(
          `${actionName}: Which team number (${options})?`,
          "0",
        );
        if (response === null) return null;

        const idx = parseInt(response.trim(), 10);
        if (!isNaN(idx) && idx >= 0 && idx < teams.length) {
          return idx;
        }
        alert(`Invalid team number. Please choose one of: ${options}`);
        return null;
      }

      function promptAddPlayer() {
        toggleFunctionButtons();
        const teamIndex = promptTeamIndex("Add Bowler");
        if (teamIndex !== null) {
          addPlayer(teamIndex);
        }
      }

      function promptRemovePlayer() {
        toggleFunctionButtons();
        const teamIndex = promptTeamIndex("Remove Bowler");
        if (teamIndex !== null) {
          removePlayer(teamIndex);
        }
      }

      function addPlayer(teamIndex) {
        const team = teams[teamIndex];
        if (!team) return;
        team.players.push(newPlayer());
        team.selectedIndex = team.players.length - 1;
        fullRebuild();
      }

      function removePlayer(teamIndex) {
        const team = teams[teamIndex];
        if (!team || team.players.length === 0) return;
        const p = getPlayer(teamIndex);
        if (!p) return;

        if (
          !confirm(
            `Are you sure you want to remove ${p.name || "unnamed bowler"}?`,
          )
        )
          return;

        team.players.splice(team.selectedIndex, 1);
        team.selectedIndex = team.players.length
          ? Math.min(team.selectedIndex, team.players.length - 1)
          : -1;
        fullRebuild();
      }

      function clearScores() {
        if (
          !confirm(
            "This will remove ALL scores from ALL bowlers across all teams. Proceed?",
          )
        ) {
          toggleFunctionButtons();
          return;
        }
        teams.forEach((team) => {
          team.players.forEach((p) => {
            p.rolls.fill("");
            p.splits.clear();
          });
          team.selectedIndex = 0;
        });
        render();
        toggleFunctionButtons();
      }

      function selectPlayer(teamIndex, playerIndex) {
        const team = teams[teamIndex];
        if (!team || playerIndex < 0 || playerIndex >= team.players.length)
          return;
        team.selectedIndex = playerIndex;
        render();
      }

      function activeRollIndex(p) {
        for (let i = 0; i < ROLLS; i++) {
          if (p.rolls[i]) continue;
          if (
            i === 0 ||
            (i <= 18 && !isStrike(p.rolls[i - 1])) ||
            i === 19 ||
            (i === 20 && (isStrike(p.rolls[18]) || isSpare(p.rolls[19])))
          ) {
            return i;
          }
        }
        return -1;
      }

      function nextActivePlayerIndex(teamIndex, startIndex) {
        const team = teams[teamIndex];
        for (let i = 1; i <= team.players.length; i++) {
          const candidateIndex = (startIndex + i) % team.players.length;
          if (activeRollIndex(team.players[candidateIndex]) !== -1) {
            return candidateIndex;
          }
        }
        return startIndex;
      }

      function buttonRules(p, index) {
        const rules = {
          strikeSpare: "X",
          showSplit: false,
          disabledNumbers: new Set(),
        };
        if (index < 0) return rules;
        const previous = p.rolls[index - 1];
        if (index === 19) {
          rules.strikeSpare = isStrike(previous) ? "X" : "/";
          rules.showSplit =
            !isStrike(previous) &&
            rollPoints(previous) > 1 &&
            rollPoints(previous) < 9;
        } else if (index === 20) {
          rules.strikeSpare =
            isStrike(previous) || isSpare(previous) ? "X" : "/";
          rules.showSplit =
            !isStrike(previous) &&
            !isSpare(previous) &&
            rollPoints(previous) > 1 &&
            rollPoints(previous) < 9;
        } else if (index % 2 === 0) {
          rules.strikeSpare = "X";
        } else {
          rules.strikeSpare = "/";
          rules.showSplit =
            rollPoints(previous) > 1 && rollPoints(previous) < 9;
        }
        if (index % 2 === 1 || index === 19 || index === 20) {
          for (let n = 0; n <= 9; n++) {
            if (!isStrike(previous) && n + rollPoints(previous) > 9) {
              rules.disabledNumbers.add(String(n));
            }
          }
        }
        return rules;
      }

      function updateScoreButtons() {
        teams.forEach((team, teamIndex) => {
          const keypad = document.querySelector(
            `.scoreButtonTable[data-team="${teamIndex}"]`,
          );
          if (!keypad) return;

          const buttons = [...keypad.querySelectorAll("button.scoreButton")];
          const p = getPlayer(teamIndex);
          const index = p ? activeRollIndex(p) : -1;
          const rules = buttonRules(p || newPlayer(), index);

          buttons.forEach((button) => {
            button.disabled = false;
            button.style.display = "block";
            if (button.name === "strikeSpare") {
              button.textContent = rules.strikeSpare;
            } else if (button.textContent === "S") {
              button.style.display = rules.showSplit ? "block" : "none";
            } else if (button.textContent === "9") {
              button.style.display = rules.showSplit ? "none" : "block";
              button.disabled = rules.disabledNumbers.has(button.textContent);
            } else if (/^\d$/.test(button.textContent)) {
              button.disabled = rules.disabledNumbers.has(button.textContent);
            }
          });

          if (p && index === -1) {
            buttons.forEach((button) => {
              button.disabled = button.textContent.length === 1;
            });
          }
        });
      }

      function addScore(teamIndex, button) {
        const p = getPlayer(teamIndex);
        if (!p) return;
        const index = activeRollIndex(p);
        if (index < 0) return;
        p.rolls[index] = button.textContent;
        p.splits.delete(index);
        const advance =
          index === 20 ||
          (index === 19 &&
            !isSpare(button.textContent) &&
            !isStrike(button.textContent) &&
            !isStrike(p.rolls[18])) ||
          (isStrike(button.textContent) && index !== 18 && index !== 19) ||
          (index % 2 === 1 && index !== 19);

        if (advance) {
          teams[teamIndex].selectedIndex = nextActivePlayerIndex(
            teamIndex,
            teams[teamIndex].selectedIndex,
          );
        }
        render();
      }

      function markSplit(teamIndex) {
        const p = getPlayer(teamIndex);
        if (!p) return;
        const index = activeRollIndex(p);
        const previous = index - 1;
        if (previous >= 0 && p.rolls[previous]) {
          p.splits.has(previous)
            ? p.splits.delete(previous)
            : p.splits.add(previous);
        }
        render();
      }

      function removeLastScore(teamIndex) {
        const p = getPlayer(teamIndex);
        if (!p) return;
        let index = activeRollIndex(p);
        if (index < 0) index = ROLLS;
        while (index > 0 && !p.rolls[index - 1]) index--;
        index--;
        while (index >= 0 && !p.rolls[index]) index--;
        if (index < 0) return;
        p.rolls[index] = "";
        p.splits.delete(index);
        render();
      }

      function chronologicalRolls(p) {
        const rolls = [];
        for (let frame = 0; frame < 9; frame++) {
          const first = p.rolls[frame * 2];
          const second = p.rolls[frame * 2 + 1];
          if (!first) break;
          rolls.push(rollPoints(first));
          if (!isStrike(first) && second) {
            rolls.push(
              isSpare(second) ? 10 - rollPoints(first) : rollPoints(second),
            );
          }
        }
        const first10 = p.rolls[18];
        const second10 = p.rolls[19];
        const third10 = p.rolls[20];
        if (first10) {
          rolls.push(rollPoints(first10));
          if (second10) {
            rolls.push(
              isSpare(second10)
                ? 10 - rollPoints(first10)
                : rollPoints(second10),
            );
          }
          if (third10) {
            rolls.push(
              isSpare(third10)
                ? 10 - rollPoints(second10)
                : rollPoints(third10),
            );
          }
        }
        return rolls;
      }

      function calculateMinScore(p) {
        const projected = { rolls: [...p.rolls], splits: new Set() };
        for (let frame = 0; frame < 9; frame++) {
          const idx1 = frame * 2;
          const idx2 = frame * 2 + 1;
          if (!projected.rolls[idx1]) {
            projected.rolls[idx1] = "0";
            projected.rolls[idx2] = "0";
          } else if (
            !isStrike(projected.rolls[idx1]) &&
            !projected.rolls[idx2]
          ) {
            projected.rolls[idx2] = "0";
          }
        }
        const r18 = projected.rolls[18];
        const r19 = projected.rolls[19];
        if (!r18) {
          projected.rolls[18] = "0";
          projected.rolls[19] = "0";
        } else if (!r19) {
          projected.rolls[19] = "0";
        }
        if (
          (isStrike(projected.rolls[18]) ||
            isSpare(projected.rolls[19]) ||
            isStrike(projected.rolls[19])) &&
          !projected.rolls[20]
        ) {
          projected.rolls[20] = "0";
        }
        const scores = calculateScores(projected);
        return scores[9] ?? 0;
      }

      function calculateMaxScore(p) {
        const projected = { rolls: [...p.rolls], splits: new Set() };
        for (let frame = 0; frame < 9; frame++) {
          const idx1 = frame * 2;
          const idx2 = frame * 2 + 1;
          if (!projected.rolls[idx1]) {
            projected.rolls[idx1] = "X";
            projected.rolls[idx2] = "";
          } else if (
            !isStrike(projected.rolls[idx1]) &&
            !projected.rolls[idx2]
          ) {
            projected.rolls[idx2] = "/";
          }
        }
        const r18 = projected.rolls[18];
        const r19 = projected.rolls[19];
        const r20 = projected.rolls[20];
        if (!r18) {
          projected.rolls[18] = "X";
          projected.rolls[19] = "X";
          projected.rolls[20] = "X";
        } else if (!r19) {
          if (isStrike(r18)) {
            projected.rolls[19] = "X";
            projected.rolls[20] = "X";
          } else {
            projected.rolls[19] = "/";
            projected.rolls[20] = "X";
          }
        } else if (!r20 && (isStrike(r18) || isSpare(r19) || isStrike(r19))) {
          projected.rolls[20] = "X";
        }
        const scores = calculateScores(projected);
        return scores[9] ?? 0;
      }

      function calculateScores(p) {
        const scores = Array(FRAMES).fill(null);
        const rolls = chronologicalRolls(p);
        let rollIndex = 0;
        let total = 0;
        for (let frame = 0; frame < 10; frame++) {
          if (rollIndex >= rolls.length) break;
          if (frame < 9) {
            const first = rolls[rollIndex];
            if (first === 10) {
              if (rollIndex + 2 >= rolls.length) break;
              total += 10 + rolls[rollIndex + 1] + rolls[rollIndex + 2];
              scores[frame] = total;
              rollIndex += 1;
              continue;
            }
            if (rollIndex + 1 >= rolls.length) break;
            const firstBall = rolls[rollIndex];
            const secondBall = rolls[rollIndex + 1];
            if (firstBall + secondBall === 10) {
              if (rollIndex + 2 >= rolls.length) break;
              total += 10 + rolls[rollIndex + 2];
            } else {
              total += firstBall + secondBall;
            }
            scores[frame] = total;
            rollIndex += 2;
            continue;
          }
          const frame10Rolls = rolls.slice(rollIndex);
          if (frame10Rolls.length < 2) break;
          const first = frame10Rolls[0];
          const second = frame10Rolls[1];
          const needsThird = first === 10 || first + second === 10;
          if (needsThird && frame10Rolls.length < 3) break;
          total += frame10Rolls
            .slice(0, needsThird ? 3 : 2)
            .reduce((sum, ball) => sum + ball, 0);
          scores[frame] = total;
        }
        return scores;
      }

      function buildKeypadHTML(teamIndex) {
        return `
          <div class="container-keypad">
            <table class="scoreButtonTable" data-team="${teamIndex}">
              <tr>
                <td class="scoreButtonCell">
                  <button class="scoreButton" onclick="removeLastScore(${teamIndex})">&lt;-</button>
                </td>
                <td class="scoreButtonCell">
                  <button class="scoreButton" onclick="addScore(${teamIndex}, this)">9</button>
                  <button class="scoreButton" onclick="markSplit(${teamIndex})">S</button>
                </td>
                <td class="scoreButtonCell"><button class="scoreButton" onclick="addScore(${teamIndex}, this)">7</button></td>
                <td class="scoreButtonCell"><button class="scoreButton" onclick="addScore(${teamIndex}, this)">5</button></td>
                <td class="scoreButtonCell"><button class="scoreButton" onclick="addScore(${teamIndex}, this)">3</button></td>
                <td class="scoreButtonCell"><button class="scoreButton" onclick="addScore(${teamIndex}, this)">1</button></td>
              </tr>
              <tr>
                <td class="scoreButtonCell">
                  <button name="strikeSpare" class="scoreButton" onclick="addScore(${teamIndex}, this)">X</button>
                </td>
                <td class="scoreButtonCell"><button class="scoreButton" onclick="addScore(${teamIndex}, this)">8</button></td>
                <td class="scoreButtonCell"><button class="scoreButton" onclick="addScore(${teamIndex}, this)">6</button></td>
                <td class="scoreButtonCell"><button class="scoreButton" onclick="addScore(${teamIndex}, this)">4</button></td>
                <td class="scoreButtonCell"><button class="scoreButton" onclick="addScore(${teamIndex}, this)">2</button></td>
                <td class="scoreButtonCell"><button class="scoreButton" onclick="addScore(${teamIndex}, this)">0</button></td>
              </tr>
            </table>
          </div>
        `;
      }

      function render() {
        const requiresRebuild = teams.some(
          (t) => !t.tbody || t.tbody.children.length !== t.players.length * 3,
        );
        if (requiresRebuild) {
          fullRebuild();
          return;
        }

        teams.forEach((team, tIdx) => {
          team.players.forEach((p, idx) => {
            const nameRow = team.tbody.children[idx * 3];
            const rollRow = team.tbody.children[idx * 3 + 1];
            const totalRow = team.tbody.children[idx * 3 + 2];
            const isCurrent = idx === team.selectedIndex;

            [nameRow, rollRow, totalRow].forEach((row) => {
              row.classList.toggle("selected", isCurrent);
            });

            const scores = calculateScores(p);
            p.rolls.forEach((roll, rIdx) => {
              const cell = rollRow.cells[rIdx];
              cell.textContent = roll;
              cell.classList.toggle("split", p.splits.has(rIdx));
              cell.classList.toggle(
                "selected",
                isCurrent && rIdx === activeRollIndex(p),
              );
            });

            scores.forEach((score, fIdx) => {
              const cell = totalRow.cells[fIdx];
              cell.textContent = score !== null ? score : "";
              cell.classList.toggle("isvisible", score !== null);
            });

            nameRow.cells[1].textContent = `Min: ${calculateMinScore(p)} - Max: ${calculateMaxScore(p)}`;
          });
        });

        updateScoreButtons();
      }

      function fullRebuild() {
        const container = document.getElementById("teamsContainer");
        container.replaceChildren();

        teams.forEach((team, tIdx) => {
          const wrapper = document.createElement("div");
          wrapper.className = "team-wrapper";

          // Team Score Table
          const table = document.createElement("table");
          table.className = "scoreTable";
          table.innerHTML = `
            <thead>
              <tr>
                <th class="frame" colspan="2">1</th>
                <th class="frame" colspan="2">2</th>
                <th class="frame" colspan="2">3</th>
                <th class="frame" colspan="2">4</th>
                <th class="frame" colspan="2">5</th>
                <th class="frame" colspan="2">6</th>
                <th class="frame" colspan="2">7</th>
                <th class="frame" colspan="2">8</th>
                <th class="frame" colspan="2">9</th>
                <th class="frame" colspan="3">10</th>
              </tr>
            </thead>
            <tbody></tbody>
          `;

          const tbody = table.querySelector("tbody");
          team.tbody = tbody;

          team.players.forEach((p, index) => {
            const nameRow = document.createElement("tr");
            const rollRow = document.createElement("tr");
            const totalRow = document.createElement("tr");

            const nameCell = document.createElement("td");
            nameCell.colSpan = 8;
            const input = document.createElement("input");
            input.className = "input-playername";
            input.placeholder = `Bowler ${index + 1}`;
            input.value = p.name;
            input.addEventListener("input", (event) => {
              p.name = event.target.value;
            });
            nameCell.appendChild(input);
            nameRow.appendChild(nameCell);

            const note = document.createElement("td");
            note.colSpan = 13;
            note.className = "playerNote";
            nameRow.appendChild(note);

            for (let r = 0; r < ROLLS; r++) {
              const cell = document.createElement("td");
              cell.className = "roll";
              rollRow.appendChild(cell);
            }

            for (let f = 0; f < FRAMES; f++) {
              const cell = document.createElement("td");
              cell.colSpan = f === 9 ? 3 : 2;
              cell.className = "frameTotal";
              totalRow.appendChild(cell);
            }

            [nameRow, rollRow, totalRow].forEach((row) => {
              row.addEventListener("click", (event) => {
                if (event.target !== input) selectPlayer(tIdx, index);
              });
              tbody.appendChild(row);
            });
          });

          wrapper.appendChild(table);

          // Append Keypad for this Team
          const keypadContainer = document.createElement("div");
          keypadContainer.innerHTML = buildKeypadHTML(tIdx);
          wrapper.appendChild(keypadContainer);

          container.appendChild(wrapper);
        });

        render();
      }

      function loadHeaderViaJSONP() {
        toggleFunctionButtons();
        const scriptId = "google-sheet-jsonp-script";
        const existingScript = document.getElementById(scriptId);
        if (existingScript) existingScript.remove();

        window.googleSheetCallback = function (data) {
          try {
            console.log("Spreadsheet Data Received", data.table.rows);
            const dataRow = data.table.rows[spreadSheetRow];
            const headerText =
              dataRow && dataRow.c[spreadSheetCol]
                ? `${dataRow.c[spreadSheetCol].v}`
                : "";
            const headerInput = document.querySelector("#TopMessage");
            if (headerInput && headerText) headerInput.value = headerText;
          } catch (err) {
            console.error("Error parsing Google Sheet data:", err);
          } finally {
            const currentScript = document.getElementById(scriptId);
            if (currentScript) currentScript.remove();
          }
        };

        const script = document.createElement("script");
        script.id = scriptId;
        script.src = `https://docs.google.com/spreadsheets/d/${spreadSheetId}/gviz/tq?tqx=responseHandler:googleSheetCallback&_t=${Date.now()}`;
        script.onerror = function () {
          console.error("Failed to load data from Google Sheets.");
          script.remove();
        };
        document.body.appendChild(script);
      }

      window.addEventListener("DOMContentLoaded", initApp);
    </script>
  </body>
</html>
